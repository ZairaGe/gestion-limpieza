<div class="layout-container">
  <aside class="sidebar">
    <div class="logo">
      <img src="../favicon.jpg" alt="logo">
      <span class="logo-texto">{{ nombreApp }}</span>
    </div>

    <nav>
      @for (item of menuItems; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="active" class="menu-item">
          <svg [lucideIcon]="item.icono" [size]="18" [strokeWidth]="1.75"></svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <span class="email"></span>
      <button class="logout-btn" (click)="cerrarSesion()">
        <svg [lucideIcon]="IconSalir" [size]="18" [strokeWidth]="1.75"></svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
